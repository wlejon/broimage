name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Image decoding is the reason this is worth running. broimage takes in PNG and
# JPEG bytes — the most untrusted input any of these repos handles — and the
# ops downstream index buffers by width/height/channel arithmetic that comes
# straight out of a file header. Out-of-bounds reads and integer overflow in a
# stride computation are the realistic bug, and they are exactly what the C++
# queries look for.
jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          path: broimage

      - uses: actions/checkout@v7
        with:
          repository: wlejon/bromath
          path: bromath

      - uses: actions/checkout@v7
        with:
          repository: wlejon/brotensor
          path: brotensor

      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Configure
        run: cmake -S broimage -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      # Everything below is code this repo does not own: vendored stb, and the
      # sibling checkouts CMake compiles into the build. Building it here, ahead
      # of `init`, is what keeps it out of the analysis.
      #
      # For a compiled language CodeQL analyses what it observes the compiler
      # compile while tracing, so anything already built when `init` runs is
      # never extracted. `paths-ignore` cannot do this job — it does not filter
      # compiled sources — so the build order is the exclusion mechanism, and
      # moving these targets into the traced build below silently puts every one
      # of their findings back in the Security tab.
      #
      # Why each target is excluded:
      #
      #   stb_image  — stb trips analysers by design (deliberate integer wrapping,
      #     unchecked pointer walks in the decoders). Those findings are real
      #     questions for upstream, not for us, and a permanent wall of alerts
      #     nobody can action is exactly how a Security tab becomes something
      #     everyone ignores — including on the day a genuine broimage bug lands.
      #
      #   brotensor_core / brotensor_cpu — analysed by brotensor's own CodeQL
      #     workflow. Extracting them here would double-report every finding
      #     against the wrong repo. (bromath needs no entry: it is header-only,
      #     so it has no TUs of its own — its headers are analysed where broimage
      #     includes them, which is correct.)
      - name: Pre-build vendored + sibling code (outside the traced build)
        run: cmake --build build --parallel 4 --target stb_image brotensor_core brotensor_cpu

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      # Only broimage's own TUs are left to compile, so only they are traced.
      - name: Build broimage (traced)
        run: cmake --build build --parallel 4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
