name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Image decoding is the reason this is worth running. broimage takes in PNG and
# JPEG bytes — the most untrusted input any of these repos handles — and the
# ops downstream index buffers by width/height/channel arithmetic that comes
# straight out of a file header. Out-of-bounds reads and integer overflow in a
# stride computation are the realistic bug, and they are exactly what the C++
# queries look for.
jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          path: broimage

      - uses: actions/checkout@v7
        with:
          repository: wlejon/bromath
          path: bromath

      - uses: actions/checkout@v7
        with:
          repository: wlejon/brotensor
          path: brotensor

      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
          # Ignore code we don't own and can't fix:
          #
          #   third_party/stb  — vendored stb_image. It is well-known for
          #     tripping static analysers (deliberate integer wrapping, unchecked
          #     pointer walks in the decoders). Real findings there belong
          #     upstream, and leaving them in our Security tab means a permanent
          #     wall of alerts nobody can action — which trains everyone to
          #     ignore the tab, including when a real broimage bug lands in it.
          #
          #   bromath, brotensor — sibling checkouts. They are analysed by their
          #     own CodeQL workflows; alerting on them here would double-report
          #     every finding against the wrong repo.
          config: |
            paths-ignore:
              - broimage/third_party/**
              - bromath/**
              - brotensor/**

      - name: Build
        run: |
          cmake -S broimage -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel 4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
